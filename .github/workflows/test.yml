name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv with Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked --extra test

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src api tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Reject empty or truncated test discovery
        env:
          PYTHONPATH: src
        run: uv run --locked python scripts/check_test_discovery.py --minimum 40

      - name: Check the tracked public tree
        run: uv run --locked python scripts/check_public_tree.py
